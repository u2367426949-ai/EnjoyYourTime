# =====================================================
# Configuration Netlify — EnjoyYourTime V2
# =====================================================
# Ce fichier est utilisé quand le site V2 est déployé
# comme site séparé sur Netlify avec "Base directory: v2"

[build]
  publish = "."       # Dossier v2/ publié (relatif au base directory)
  command = ""        # Pas de build (site statique)

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Headers cache pour les assets statiques
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
